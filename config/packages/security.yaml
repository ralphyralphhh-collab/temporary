security:
    password_hashers:
        App\Entity\Customer: 'auto'
        App\Entity\AdminUser: 'auto'

    providers:
        customer_provider:
            entity:
                class: App\Entity\Customer
                property: email
        admin_provider:
            entity:
                class: App\Entity\AdminUser
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Replaces includes/admin_auth.php
        admin:
            pattern: ^/admin
            provider: admin_provider
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
            logout:
                path: app_admin_logout
                target: app_admin_login

        # Replaces includes/customer_auth.php
        main:
            lazy: true
            provider: customer_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/account/orders, roles: ROLE_CUSTOMER }

when@test:
    security:
        password_hashers:
            App\Entity\Customer:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10